<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="WordCheck — AI-Tell Scanner for Word Documents">
  <defs>
    <pattern id="grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.04"/>
    </pattern>
    <pattern id="scanlines" x="0" y="0" width="2" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="#000000" opacity="0.12"/>
    </pattern>
    <linearGradient id="bggrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e0e18"/>
      <stop offset="100%" stop-color="#131320"/>
    </linearGradient>
    <linearGradient id="divgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a86d0" stop-opacity="0"/>
      <stop offset="30%" stop-color="#8a86d0" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" fill="url(#bggrad)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect width="1200" height="340" fill="url(#scanlines)"/>

  <!-- Glow blobs -->
  <ellipse cx="80" cy="170" rx="140" ry="100" fill="#8a86d0" opacity="0.06"/>
  <ellipse cx="1120" cy="170" rx="140" ry="100" fill="#ffffff" opacity="0.04"/>

  <!-- === WORD — lavender pixel-art block letters === -->

  <!-- W -->
  <rect x="80"  y="90" width="14" height="80" fill="#8a86d0" rx="2"/>
  <rect x="106" y="90" width="14" height="80" fill="#8a86d0" rx="2"/>
  <rect x="132" y="90" width="14" height="80" fill="#8a86d0" rx="2"/>
  <rect x="80"  y="156" width="66" height="14" fill="#8a86d0" rx="2"/>
  <rect x="93"  y="140" width="14" height="30" fill="#8a86d0" rx="2"/>
  <rect x="119" y="140" width="14" height="30" fill="#8a86d0" rx="2"/>
  <rect x="78" y="88" width="70" height="84" rx="4" fill="none" stroke="#8a86d0" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>

  <!-- O -->
  <rect x="164" y="90" width="14" height="84" fill="#8a86d0" rx="2"/>
  <rect x="220" y="90" width="14" height="84" fill="#8a86d0" rx="2"/>
  <rect x="164" y="90" width="70" height="14" fill="#8a86d0" rx="2"/>
  <rect x="164" y="160" width="70" height="14" fill="#8a86d0" rx="2"/>
  <rect x="162" y="88" width="74" height="88" rx="4" fill="none" stroke="#8a86d0" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>

  <!-- R -->
  <rect x="252" y="90" width="14" height="84" fill="#8a86d0" rx="2"/>
  <rect x="252" y="90" width="56" height="14" fill="#8a86d0" rx="2"/>
  <rect x="252" y="126" width="56" height="14" fill="#8a86d0" rx="2"/>
  <rect x="295" y="90" width="14" height="50" fill="#8a86d0" rx="2"/>
  <rect x="280" y="140" width="14" height="34" fill="#8a86d0" rx="2"/>
  <rect x="296" y="148" width="14" height="26" fill="#8a86d0" rx="2"/>
  <rect x="250" y="88" width="62" height="88" rx="4" fill="none" stroke="#8a86d0" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>

  <!-- D -->
  <rect x="332" y="90" width="14" height="84" fill="#8a86d0" rx="2"/>
  <rect x="332" y="90" width="46" height="14" fill="#8a86d0" rx="2"/>
  <rect x="332" y="160" width="46" height="14" fill="#8a86d0" rx="2"/>
  <rect x="366" y="104" width="14" height="56" fill="#8a86d0" rx="2"/>
  <rect x="330" y="88" width="52" height="88" rx="4" fill="none" stroke="#8a86d0" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>

  <!-- Divider pip -->
  <rect x="408" y="120" width="6" height="6" fill="#8a86d0" rx="1" opacity="0.7"/>
  <rect x="408" y="136" width="6" height="6" fill="#ffffff" rx="1" opacity="0.5"/>
  <rect x="408" y="152" width="6" height="6" fill="#8a86d0" rx="1" opacity="0.3"/>

  <!-- === CHECK — white pixel-art block letters === -->

  <!-- C -->
  <rect x="432" y="90" width="70" height="14" fill="#ffffff" rx="2"/>
  <rect x="432" y="160" width="70" height="14" fill="#ffffff" rx="2"/>
  <rect x="432" y="90" width="14" height="84" fill="#ffffff" rx="2"/>
  <rect x="430" y="88" width="74" height="88" rx="4" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="3 3" opacity="0.35"/>

  <!-- H -->
  <rect x="520" y="90" width="14" height="84" fill="#ffffff" rx="2"/>
  <rect x="576" y="90" width="14" height="84" fill="#ffffff" rx="2"/>
  <rect x="520" y="126" width="70" height="14" fill="#ffffff" rx="2"/>
  <rect x="518" y="88" width="74" height="88" rx="4" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="3 3" opacity="0.35"/>

  <!-- E -->
  <rect x="608" y="90" width="14" height="84" fill="#ffffff" rx="2"/>
  <rect x="608" y="90" width="64" height="14" fill="#ffffff" rx="2"/>
  <rect x="608" y="126" width="54" height="14" fill="#ffffff" rx="2"/>
  <rect x="608" y="160" width="64" height="14" fill="#ffffff" rx="2"/>
  <rect x="606" y="88" width="68" height="88" rx="4" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="3 3" opacity="0.35"/>

  <!-- C -->
  <rect x="692" y="90" width="70" height="14" fill="#ffffff" rx="2"/>
  <rect x="692" y="160" width="70" height="14" fill="#ffffff" rx="2"/>
  <rect x="692" y="90" width="14" height="84" fill="#ffffff" rx="2"/>
  <rect x="690" y="88" width="74" height="88" rx="4" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="3 3" opacity="0.35"/>

  <!-- K -->
  <rect x="780" y="90" width="14" height="84" fill="#ffffff" rx="2"/>
  <rect x="794" y="126" width="42" height="14" fill="#ffffff" rx="2"/>
  <rect x="808" y="90" width="14" height="40" fill="#ffffff" rx="2"/>
  <rect x="820" y="78" width="14" height="50" fill="#ffffff" rx="2"/>
  <rect x="808" y="144" width="14" height="30" fill="#ffffff" rx="2"/>
  <rect x="820" y="150" width="14" height="26" fill="#ffffff" rx="2"/>
  <rect x="778" y="88" width="58" height="88" rx="4" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="3 3" opacity="0.35"/>

  <!-- Gradient divider line -->
  <rect x="80" y="198" width="760" height="1" fill="url(#divgrad)"/>

  <!-- Subtitle -->
  <text x="82" y="225" font-family="'Courier New', Courier, monospace" font-size="15" fill="#8a86d0" opacity="0.9" letter-spacing="3">AI-TELL SCANNER FOR WORD DOCUMENTS</text>

  <!-- Tag pills -->
  <rect x="82"  y="248" width="72" height="24" rx="12" fill="#8a86d0" opacity="0.15"/>
  <rect x="82"  y="248" width="72" height="24" rx="12" fill="none" stroke="#8a86d0" stroke-width="0.8" opacity="0.5"/>
  <text x="118" y="264" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" fill="#a8a4e8" letter-spacing="1">.DOCX</text>

  <rect x="164" y="248" width="78" height="24" rx="12" fill="#8a86d0" opacity="0.1"/>
  <rect x="164" y="248" width="78" height="24" rx="12" fill="none" stroke="#8a86d0" stroke-width="0.8" opacity="0.4"/>
  <text x="203" y="264" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" fill="#a8a4e8" letter-spacing="1">NODE.JS</text>

  <rect x="252" y="248" width="52" height="24" rx="12" fill="#ffffff" opacity="0.06"/>
  <rect x="252" y="248" width="52" height="24" rx="12" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.3"/>
  <text x="278" y="264" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" fill="#d0d0d0" letter-spacing="1">CLI</text>

  <rect x="314" y="248" width="54" height="24" rx="12" fill="#ffffff" opacity="0.05"/>
  <rect x="314" y="248" width="54" height="24" rx="12" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.25"/>
  <text x="341" y="264" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" fill="#d0d0d0" letter-spacing="1">NPM</text>

  <!-- Right side cluster -->
  <text x="920" y="130" font-family="'Courier New', Courier, monospace" font-size="12" fill="#8a86d0" opacity="0.5" letter-spacing="2">@frekijosh/wordcheck</text>

  <rect x="920" y="148" width="220" height="70" rx="6" fill="#ffffff" opacity="0.03"/>
  <rect x="920" y="148" width="220" height="70" rx="6" fill="none" stroke="#8a86d0" stroke-width="0.6" opacity="0.2"/>

  <text x="936" y="172" font-family="'Courier New', Courier, monospace" font-size="11" fill="#e87b7b" letter-spacing="1">HIGH</text>
  <rect x="978" y="162" width="28" height="10" rx="2" fill="#e87b7b" opacity="0.8"/>
  <rect x="1008" y="162" width="6"  height="10" rx="2" fill="#e87b7b" opacity="0.4"/>

  <text x="936" y="190" font-family="'Courier New', Courier, monospace" font-size="11" fill="#f0c472" letter-spacing="1">MED</text>
  <rect x="978" y="180" width="52" height="10" rx="2" fill="#f0c472" opacity="0.8"/>
  <rect x="1032" y="180" width="10" height="10" rx="2" fill="#f0c472" opacity="0.4"/>

  <text x="936" y="208" font-family="'Courier New', Courier, monospace" font-size="11" fill="#7ad0a0" letter-spacing="1">LOW</text>
  <rect x="978" y="198" width="112" height="10" rx="2" fill="#7ad0a0" opacity="0.8"/>
  <rect x="1092" y="198" width="20"  height="10" rx="2" fill="#7ad0a0" opacity="0.4"/>

  <text x="920" y="250" font-family="'Courier New', Courier, monospace" font-size="12" fill="#ffffff" opacity="0.2">$ npm install -g</text>
  <text x="1062" y="250" font-family="'Courier New', Courier, monospace" font-size="12" fill="#8a86d0" opacity="0.6">@frekijosh/wordcheck</text>

  <!-- Bottom-right pixel accent -->
  <rect x="1120" y="266" width="8" height="8" rx="1" fill="#8a86d0" opacity="0.25"/>
  <rect x="1132" y="266" width="8" height="8" rx="1" fill="#8a86d0" opacity="0.12"/>
  <rect x="1120" y="278" width="8" height="8" rx="1" fill="#ffffff" opacity="0.08"/>
  <rect x="1132" y="278" width="8" height="8" rx="1" fill="#8a86d0" opacity="0.06"/>
</svg>
