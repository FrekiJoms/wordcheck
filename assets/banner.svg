<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="WordCheck banner: AI-Tell Scanner for Word Documents">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)" rx="8"/>
  <!-- Document icon -->
  <g transform="translate(80, 75)" fill="none" stroke="#e94560" stroke-width="3">
    <rect x="0" y="0" width="80" height="100" rx="4"/>
    <line x1="15" y1="25" x2="65" y2="25"/>
    <line x1="15" y1="40" x2="65" y2="40"/>
    <line x1="15" y1="55" x2="50" y2="55"/>
    <line x1="15" y1="70" x2="55" y2="70"/>
    <circle cx="60" cy="80" r="18" fill="#e94560" stroke="none"/>
    <text x="60" y="86" text-anchor="middle" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="bold">AI</text>
  </g>
  <!-- Title -->
  <text x="220" y="130" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="bold">wordcheck</text>
  <!-- Accent line -->
  <rect x="220" y="145" width="180" height="4" rx="2" fill="url(#accent)"/>
  <!-- Subtitle -->
  <text x="220" y="180" fill="#a0a0b8" font-family="Segoe UI, Arial, sans-serif" font-size="22">AI-Tell Scanner for Word Documents</text>
  <!-- Tags -->
  <g transform="translate(220, 200)">
    <rect x="0" y="0" width="90" height="28" rx="14" fill="#e94560" opacity="0.2"/>
    <text x="45" y="19" text-anchor="middle" fill="#ff6b6b" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">.DOCX</text>
    <rect x="100" y="0" width="90" height="28" rx="14" fill="#e94560" opacity="0.2"/>
    <text x="145" y="19" text-anchor="middle" fill="#ff6b6b" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">PYTHON</text>
    <rect x="200" y="0" width="90" height="28" rx="14" fill="#e94560" opacity="0.2"/>
    <text x="245" y="19" text-anchor="middle" fill="#ff6b6b" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">NODE.JS</text>
    <rect x="300" y="0" width="90" height="28" rx="14" fill="#e94560" opacity="0.2"/>
    <text x="345" y="19" text-anchor="middle" fill="#ff6b6b" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">CLI</text>
  </g>
</svg>
